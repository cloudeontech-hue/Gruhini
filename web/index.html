<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gruhini Foods">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gruhini Foods</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JavaScript API, required by google_maps_flutter on web
       (lib/screens/checkout/location_picker_screen.dart). Same Google
       Cloud API key as GOOGLE_GEOCODING_API_KEY in .env - restrict it to
       this site's HTTP referrer in Google Cloud Console rather than
       relying on secrecy, same as the Android key is restricted by
       package name + SHA-1. Must be a static tag (not read from .env at
       runtime) since the Maps JS SDK has to load before Flutter starts. -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD9_1gEQ7735QAYzXlMas_xwh3W6jA20Is"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
